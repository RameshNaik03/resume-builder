# Fast checks on every push: the server's lint and API test suites, and the client's lint and build.
# The slower browser suites run in browser-tests.yml.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The tests create (and drop) their own throwaway databases here
      mongo:
        # Exact version, the same as server/docker-compose.yml. Not 8.x: it refuses to start on
        # the runners' Linux kernel (6.19+), see https://jira.mongodb.org/browse/SERVER-125742
        image: mongo:7.0.45
        ports:
          - 27017:27017
        # The job waits until this ping answers (and stops if it never does)
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-start-period 20s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # A clear failure (with MongoDB's own log) if the database isn't answering
      - name: Check MongoDB is up
        run: |
          if version=$(docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval 'db.version()' 2>&1); then
            echo "MongoDB $version is up"
          else
            echo "::error title=MongoDB didn't start::The mongo service container isn't answering. Its log is below."
            docker logs --tail 50 "${{ job.services.mongo.id }}"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
