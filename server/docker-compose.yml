# Local MongoDB for development. `npm run dev` starts it automatically.
# Data is kept in the "mongo-data" volume, so it survives restarts.
# MongoDB 7.0, the same exact version as CI (.github/workflows): MongoDB 8.x refuses to start
# on Linux kernels 6.19+, which GitHub's runners use. See
# https://jira.mongodb.org/browse/SERVER-125742. 7.0 is supported until August 2027.
services:
  mongo:
    image: mongo:7.0.45
    container_name: resume-builder-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
